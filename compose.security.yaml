# Overlay the owner's existing Compose file. Replaces web/gateway/migrate images only.
services:
  migrate:
    image: ${SECURITY_IMAGE:?Set SECURITY_IMAGE to the tested image}
    pull_policy: never
  web:
    image: ${SECURITY_IMAGE:?Set SECURITY_IMAGE to the tested image}
    pull_policy: never
    environment:
      AUTH_MODE: ${AUTH_MODE:-local-demo}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://127.0.0.1:3100,http://localhost:3100}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      GATEWAY_MODE: ${GATEWAY_MODE:-hostname}
      PUBLIC_SITE_DOMAIN: ${PUBLIC_SITE_DOMAIN:-uploads.localhost}
      PUBLIC_SITE_SCHEME: ${PUBLIC_SITE_SCHEME:-http}
      PUBLIC_SITE_PORT: ${GATEWAY_PORT:-4100}
      VIEWER_PUBLIC_ORIGIN: ${VIEWER_PUBLIC_ORIGIN:-}
      GATEWAY_FRAME_SOURCE: ${GATEWAY_FRAME_SOURCE:-http://*.uploads.localhost:4100}
  gateway:
    image: ${SECURITY_IMAGE:?Set SECURITY_IMAGE to the tested image}
    pull_policy: never
    environment:
      GATEWAY_MODE: ${GATEWAY_MODE:-hostname}
      PUBLIC_SITE_DOMAIN: ${PUBLIC_SITE_DOMAIN:-uploads.localhost}
      PUBLIC_SITE_SCHEME: ${PUBLIC_SITE_SCHEME:-http}
      PUBLIC_SITE_PORT: ${GATEWAY_PORT:-4100}
      GATEWAY_RESERVED_HOSTS: ${GATEWAY_RESERVED_HOSTS:-www,mail,api,admin,studio,view}
      GATEWAY_VIEWER_ORIGIN: ${VIEWER_PUBLIC_ORIGIN:-http://127.0.0.1:3100}
      GATEWAY_PREVIEW_ORIGIN: ${STUDIO_PUBLIC_ORIGIN:-http://127.0.0.1:3100}
