name: Security integration
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "db/**"
      - "package*.json"
      - "Dockerfile"
      - "compose*.yaml"
      - ".github/workflows/security-integration.yml"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth-upload-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Reproduce restrictive Git checkout permissions
        run: chmod -R go-rwx scripts db cloudflare/read-model/queries
      - run: docker build -t html-share-security:ci .
      - name: Verify runtime files as the image non-root user
        run: node scripts/check-runtime-image.mjs html-share-security:ci
      - run: node scripts/run-security-integration.mjs
