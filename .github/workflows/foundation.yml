name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:public-worker
      - run: npm run build
  public-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: outbox_test
          POSTGRES_USER: outbox_test
          POSTGRES_PASSWORD: synthetic_outbox_fixture_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outbox_test -d outbox_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: outbox_test
      PGUSER: outbox_test
      PGPASSWORD: synthetic_outbox_fixture_only
      UPLOAD_TEST_GUARD: isolated-public-outbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run test:projection-integration
