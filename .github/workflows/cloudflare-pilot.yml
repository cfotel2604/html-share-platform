name: Cloudflare pilot checks
on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'tests/cloudflare/**'
      - 'src/lib/cloudflare-*'
      - 'package*.json'
      - '.github/workflows/cloudflare-pilot.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-d1-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:cloudflare
      - run: npm run build:workers
