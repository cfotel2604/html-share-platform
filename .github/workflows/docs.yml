name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate required docs and local links
        run: python3 scripts/check_docs.py
